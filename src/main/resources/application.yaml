spring:
  application:
    name: qbe
  sql:
    init:
      mode: never
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.testcontainers: INFO
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
